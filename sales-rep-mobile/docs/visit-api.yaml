openapi: 3.0.3
info:
  title: SFA External Mobile API
  version: 1.6.0
  description: Backend contract for the sales-representative-isolated SFA mobile application.
servers:
  - url: http://localhost:4000/api
security:
  - bearerAuth: []
paths:
  /health:
    get:
      security: []
      summary: Check API availability
      responses:
        "200": { description: API status }
  /auth/request-code:
    post:
      security: []
      summary: Email a short-lived distributor sign-in code
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
      responses:
        "200": { description: Code sent to the distributor email }
        "403": { description: Active Salesforce distributor missing }
        "503": { description: Server email delivery is not configured }
  /auth/verify-code:
    post:
      security: []
      summary: Verify the emailed code and create a distributor-scoped session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, code]
              properties:
                email: { type: string, format: email }
                code: { type: string, pattern: "^[0-9]{6}$" }
      responses:
        "200": { description: Signed session and distributor identity }
        "401": { description: Code invalid or expired }
  /auth/session:
    get:
      summary: Read the current distributor identity
      responses:
        "200": { description: Current session }
        "401": { description: Session missing or expired }
  /auth/logout:
    post:
      summary: End the local application session
      responses:
        "200": { description: Signed out }
  /dashboard:
    get:
      summary: Load distributor dashboard and active schemes
      responses:
        "200": { description: Distributor identity, login email, assigned beat, metrics, and active schemes }
  /schemes:
    get:
      summary: List active Salesforce schemes
      responses:
        "200": { description: Active schemes }
  /products:
    get:
      summary: List sellable Salesforce products
      responses:
        "200":
          description: Product catalogue with Salesforce brand, sub-brand and alias for each product; empty values are returned as empty strings
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    type: array
                    items:
                      type: object
                      required: [id, name, brand, subBrand, brandAlias]
                      properties:
                        id: { type: string }
                        name: { type: string }
                        brand: { type: string, description: Product__c.Brand__c }
                        subBrand: { type: string, description: Product__c.Sub_Brand__c }
                        brandAlias: { type: string, description: Product__c.Brand_Alias__c }
  /outlets:
    get:
      summary: List outlets belonging to the authenticated distributor
      responses:
        "200": { description: Allocated outlets with visit count, last visit time/location, and five recent visits }
  /outlets/{storeId}/visit-status:
    post:
      summary: Record Not Visited or Not Available against an allocated outlet
      responses:
        "200": { description: Missed visit recorded in Salesforce }
  /orders:
    get:
      summary: List orders belonging to the authenticated distributor
      responses:
        "200": { description: Distributor orders }
    post:
      summary: Atomically create one Salesforce order per visit with validated order items and visit totals; retries reuse the persisted order
      responses:
        "200": { description: Order created or idempotently reused }
  /beats:
    get:
      summary: List beats assigned to the authenticated distributor
      responses:
        "200": { description: Distributor beats }
  /beats/{beatId}/stores:
    get:
      summary: List distributor-authorized outlets in one beat
      parameters:
        - in: path
          name: beatId
          required: true
          schema: { type: string }
      responses:
        "200": { description: Authorized outlets }
  /stores/{storeId}:
    get:
      summary: Read an authorized outlet
      parameters:
        - in: path
          name: storeId
          required: true
          schema: { type: string }
      responses:
        "200": { description: Outlet details }
        "404": { description: Outlet not found or not authorized }
  /visits:
    get:
      summary: List distributor-authorized visits
      responses:
        "200": { description: Visit list with check-in/check-out time, duration, and captured coordinates }
    post:
      summary: Create a visit against an approved journey plan
      responses:
        "200": { description: Visit created }
        "422": { description: Approved journey plan required }
  /store/validate-location:
    post:
      summary: Validate the device is within 100 metres of the outlet
      responses:
        "200": { description: Distance and allowed result }
        "422": { description: Outlet geolocation missing }
  /store/visit/start:
    post:
      summary: Check in and create an idempotent Salesforce visit
      responses:
        "200": { description: Visit started }
  /store/checkout:
    post:
      summary: Complete the visit in Salesforce
      responses:
        "200": { description: Visit completed; response separately reports retailerEmailSent or retailerEmailError so email failure never reverses visit completion }
        "409": { description: A saved order draft must be submitted before checkout }
  /visits/{visitId}:
    get:
      summary: Restore the signed-in employee's visit, submitted order or draft, saved actions and refusals from Salesforce
      parameters:
        - in: path
          name: visitId
          required: true
          schema: { type: string }
      responses:
        "200": { description: Owned visit restored even after a backend restart }
        "404": { description: Visit missing or owned by another employee }
  /visits/{visitId}/order-draft:
    post:
      summary: Replace the recoverable order draft; final submission remains POST /orders followed by checkout
      parameters:
        - in: path
          name: visitId
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [items]
              properties:
                items:
                  type: array
                  maxItems: 200
                  items:
                    type: object
                    required: [productId, quantity]
                    properties:
                      productId: { type: string }
                      quantity: { type: number, exclusiveMinimum: true, minimum: 0 }
      responses:
        "200": { description: Draft persisted to Salesforce; safe to retry the same snapshot }
        "400": { description: Invalid quantities or more than 200 lines }
        "404": { description: Visit missing or owned by another employee }
        "409": { description: Visit completed or order already submitted }
  /documents/{kind}/{visitId}:
    get:
      summary: Generate an authenticated visit PDF or Excel file for download or native sharing
      parameters:
        - in: path
          name: kind
          required: true
          schema: { type: string, enum: [pdf, excel] }
        - in: path
          name: visitId
          required: true
          schema: { type: string }
      responses:
        "200": { description: Generated PDF or Excel attachment }
        "400": { description: Unsupported document type }
        "404": { description: Visit unavailable or not owned by the authenticated sales representative }
  /modules/{moduleName}:
    get:
      summary: Read distributor-scoped asset survey, competitor, ticket, stock-check, or return records
      responses:
        "200": { description: Salesforce module records }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
